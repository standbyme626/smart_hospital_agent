name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sha
          POSTGRES_PASSWORD: sha_pwd
          POSTGRES_DB: sha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Prepare test database
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U sha -d postgres -c "CREATE DATABASE sha_test"
          docker exec ${{ job.services.postgres.id }} psql -U sha -d sha_test -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Install
        run: pip install -r backend/requirements.txt
      - name: Lint
        run: cd backend && ruff check . ../scripts
      - name: Test
        env:
          TEST_DATABASE_URL: postgresql://sha:sha_pwd@localhost:5432/sha_test
        run: cd backend && pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Unit tests
        run: cd frontend && npm run test:unit
      - name: Build (includes TypeScript)
        run: cd frontend && npm run build
      - name: Secret gate (build output)
        run: |
          if grep -RIn "wasd1234" frontend/out .env.example docs/DEPLOYMENT-106.md; then
            echo "::error::old demo password found in build output or shipped docs"
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sha
          POSTGRES_PASSWORD: sha_pwd
          POSTGRES_DB: sha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare E2E database
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U sha -d postgres -c "CREATE DATABASE sha_e2e"
          docker exec ${{ job.services.postgres.id }} psql -U sha -d sha_e2e -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Install Playwright browser
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        env:
          CI: "true"
          E2E_DATABASE_URL: postgresql://sha:sha_pwd@localhost:5432/sha_e2e
          E2E_PYTHON: python
        run: cd frontend && npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          retention-days: 7
