name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r backend/requirements.txt
      - name: Lint
        run: cd backend && ruff check .
      - name: Test
        run: cd backend && pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Build (includes TypeScript)
        run: cd frontend && npm run build
      - name: Secret gate (build output)
        run: |
          if grep -RIn "wasd1234" frontend/out .env.example docs/DEPLOYMENT-106.md; then
            echo "::error::old demo password found in build output or shipped docs"
            exit 1
          fi
