# Smart Hospital Agent v3.1 — 106 nginx site (example, NOT applied yet)
#
# STATUS: deploy-approved-later.
# This file was created in Task 7.1 but is NOT installed or reloaded on 106.
# Review, diff against /etc/nginx/sites-available/hospital.kk.zhzepei.cn,
# back up the live file, then `nginx -t && systemctl reload nginx` only when
# approved. Never edit the live site from this repo directly.
#
# Admin Basic Auth credentials (mode 600, never committed):
#   source of truth: /root/.credentials/smart-hospital-admin-htpasswd (on 106, 600)
#   generate (bcrypt):
#     htpasswd -cB /root/.credentials/smart-hospital-admin-htpasswd admin
#     chmod 600 /root/.credentials/smart-hospital-admin-htpasswd
#   nginx workers cannot read /root, so install a root-owned, www-data-readable copy:
#     install -d -m 755 /etc/nginx/htpasswd
#     install -m 640 -o root -g www-data \
#       /root/.credentials/smart-hospital-admin-htpasswd \
#       /etc/nginx/htpasswd/smart-hospital-admin
#   rotate later (do NOT rotate production passwords in Task 7.1):
#     htpasswd -B /root/.credentials/smart-hospital-admin-htpasswd admin
#     install -m 640 -o root -g www-data ... && nginx -t && systemctl reload nginx
#   Basic Auth gates ONLY the static /admin page. The admin API is gated by
#   JWT + admin role in the app (an nginx auth_basic on /api/v1/admin/ would
#   swallow the browser's Authorization: Bearer header and 401 every call).
#   Verify: curl https://host/api/v1/admin/users without a JWT -> 401 from API.
#
# Logging: the default nginx access log format does not include the
# Authorization header or request bodies; keep it that way (do not add
# $http_authorization or $request_body to log_format).

server {
    listen 80;
    listen [::]:80;
    server_name hospital.kk.zhzepei.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hospital.kk.zhzepei.cn;

    root /var/www/hospital;
    index index.html;
    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/hospital.kk.zhzepei.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hospital.kk.zhzepei.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (v3.1). Server scope: inherited by locations that do
    # not set their own add_header directives.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Admin SPA page: Basic Auth gate.
    location ^~ /admin {
        auth_basic "smart hospital admin";
        auth_basic_user_file /etc/nginx/htpasswd/smart-hospital-admin;
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Admin API: do NOT put auth_basic here.
    # The SPA calls /api/v1/admin/* with `Authorization: Bearer <JWT>`. nginx
    # auth_basic consumes that same Authorization header and answers 401 for
    # non-Basic schemes, so Basic Auth on the API would break every admin call
    # after the page has loaded. The API gate is the JWT + admin role check in
    # the application (require_admin). If an outer network gate is wanted, use
    # one that leaves Authorization untouched (Cloudflare Access or an IP
    # allowlist), as shown commented below; /api/ already proxies this path.
    #
    # Ready-to-enable example (NOT active):
    # location ^~ /api/v1/admin/ {
    #     # Cloudflare Access: verified by the Cf-Access-* headers/cookies; the
    #     # browser's Authorization: Bearer header passes through untouched.
    #     # Add `allow <your office/VPN CIDR>; deny all;` for a pure IP allowlist.
    #     # Warning: never add auth_basic / `Authorization` rewriting here.
    #     allow 192.168.31.0/24;
    #     deny all;
    #
    #     proxy_pass http://127.0.0.1:18087;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto https;
    #     proxy_buffering off;
    #     proxy_cache off;
    #     proxy_read_timeout 300s;
    #     proxy_send_timeout 300s;
    # }

    location /api/ {
        proxy_pass http://127.0.0.1:18087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
